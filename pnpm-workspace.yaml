packages:
  - "apps/frontend"
  - "apps/backend"
  - "apps/collaboration"
# pnpm блокирует install/postinstall-скрипты зависимостей без явного разрешения.
# Prisma CLI и engines разрешены здесь, чтобы подготовить платформенные бинарники
# для generate/migrate; esbuild и unrs-resolver нужны существующим frontend-tools.
allowBuilds:
  "@prisma/engines": true
  '@scarf/scarf': false
  bcrypt: false
  core-js-pure: false
  esbuild: true
  # Необязательный нативный ускоритель msgpackr (зависимость BullMQ): без него работает на чистом JS
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true

patchedDependencies:
  '@nestjs/common@11.2.1': patches/@nestjs__common@11.2.1.patch
