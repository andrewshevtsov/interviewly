# Docker Compose для ЛОКАЛЬНОЙ РАЗРАБОТКИ. Поднимает frontend, backend и postgres.
#
# Быстрый старт всех Docker-сервисов:
#   cp .env.example .env
#   docker compose up --build
#
# Запуск только PostgreSQL в фоне (например, для локального запуска backend вне Docker):
#   docker compose up -d postgres
#
# Дальше:
#   frontend: http://localhost:3000
#   backend:  http://localhost:4000
#   postgres: localhost:5432 (при запуске в Docker backend подключается к postgres
#             по имени сервиса "postgres" в сети interviewly-network; при локальном
#             запуске backend вне Docker — через localhost, см. DATABASE_URL в .env)
#
# Сервис backend сам применяет миграции и сиды при каждом старте контейнера:
# prisma generate && prisma migrate deploy && prisma db seed.

services:
  postgres:
    # Alpine-образ меньше полного образа и достаточен для локальной разработки.
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      # Слева порт Mac, справа стандартный порт PostgreSQL в контейнере.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Именованный volume сохраняет таблицы между перезапусками контейнера.
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interviewly-network
    healthcheck:
      # Контейнер считается готовым только после ответа выбранной базы.
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewly} -d ${POSTGRES_DB:-interviewly}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - 3000:3000
    networks:
      - interviewly-network
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: ./.env
    ports:
      - 4000:4000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interviewly-network
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

networks:
  interviewly-network:
    driver: bridge
volumes:
  frontend_node_modules:
  backend_node_modules:
  postgres_data:
