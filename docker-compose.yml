# Docker Compose для ЛОКАЛЬНОЙ РАЗРАБОТКИ. Поднимает frontend, backend, postgres
# и LiveKit (SFU для видео/аудио сессий).
#
# Быстрый старт всех Docker-сервисов:
#   cp .env.example .env
#   docker compose up --build
#
# Запуск только PostgreSQL в фоне (например, для локального запуска backend вне Docker):
#   docker compose up -d postgres
#
# PostgreSQL + LiveKit (локальный backend + проверка комнат):
#   docker compose up -d postgres livekit
#   # или: pnpm db-dev
#
# Дальше:
#   frontend: http://localhost:3000
#   backend:  http://localhost:4000
#   postgres: localhost:5432 (при запуске в Docker backend подключается к postgres
#             по имени сервиса "postgres" в сети interviewly-network; при локальном
#             запуске backend вне Docker — через localhost, см. DATABASE_URL в .env)
#   livekit:  ws://localhost:7880 (signaling); RTC TCP 7881, UDP 7882
#   redis:    localhost:6379 (очередь уведомлений BullMQ)
#   mailpit:  SMTP localhost:1025, веб-интерфейс http://localhost:8025 - сюда в разработке
#             приходят письма backend'а, наружу ничего не уходит
#
# Сервис backend сам применяет миграции и сиды при каждом старте контейнера:
# prisma generate && prisma migrate deploy && prisma db seed.

services:
  postgres:
    # Alpine-образ меньше полного образа и достаточен для локальной разработки.
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      # Слева порт Mac, справа стандартный порт PostgreSQL в контейнере.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Именованный volume сохраняет таблицы между перезапусками контейнера.
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interviewly-network
    healthcheck:
      # Контейнер считается готовым только после ответа выбранной базы.
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewly} -d ${POSTGRES_DB:-interviewly}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - interviewly-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: отложенные задания (напоминание за 2 часа до встречи) переживают перезапуск Redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - interviewly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Ловушка для писем: принимает SMTP и показывает письма в браузере
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - interviewly-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Серверные компоненты Next.js ходят к backend внутри Docker-сети, а не через localhost
      BACKEND_INTERNAL_URL: http://backend:4000
    ports:
      - 3000:3000
    networks:
      - interviewly-network
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

  collaboration:
    build:
      context: .
      dockerfile: apps/collaboration/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-interviewly}:${POSTGRES_PASSWORD:-interviewly}@postgres:5432/${POSTGRES_DB:-interviewly}?schema=public
    ports:
      - "${COLLABORATION_PORT:-1234}:1234"
    depends_on:
      - backend
    networks:
      - interviewly-network
    volumes:
      - .:/app
      - collaboration_node_modules:/app/node_modules

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: ./.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-interviewly}:${POSTGRES_PASSWORD:-interviewly}@postgres:5432/${POSTGRES_DB:-interviewly}?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    ports:
      - 4000:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - interviewly-network
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

networks:
  interviewly-network:
    driver: bridge
volumes:
  redis_data:
  frontend_node_modules:
  backend_node_modules:
  collaboration_node_modules:
  postgres_data:
