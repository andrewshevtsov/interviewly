# Docker Compose для ЛОКАЛЬНОЙ РАЗРАБОТКИ. Сейчас поднимает frontend и postgres.
#
# Быстрый старт всех Docker-сервисов:
#   cp .env.example .env
#   docker compose up --build
#
# Запуск только PostgreSQL в фоне:
#   docker compose up -d postgres
#
# После первого запуска PostgreSQL:
#   pnpm --filter backend exec prisma migrate dev
#   pnpm --filter backend exec prisma generate
#
# Дальше:
#   frontend: http://localhost:3000/health
#   postgres: localhost:5432 (backend запускается локально, вне Docker,
#             и подключается к postgres через DATABASE_URL из .env)

services:
  postgres:
    # Alpine-образ меньше полного образа и достаточен для локальной разработки.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Значения берутся из корневого .env; справа указаны dev-дефолты.
      POSTGRES_USER: ${POSTGRES_USER:-interviewly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewly}
      POSTGRES_DB: ${POSTGRES_DB:-interviewly}
    ports:
      # Слева порт Mac, справа стандартный порт PostgreSQL в контейнере.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Именованный volume сохраняет таблицы между перезапусками контейнера.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Контейнер считается готовым только после ответа выбранной базы.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewly} -d ${POSTGRES_DB:-interviewly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${FRONTEND_PORT:-3000}
      # Задел на будущее — куда фронту стучаться за API, когда backend
      # появится в docker
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-4000}
      # pnpm запускает проверку node_modules/lockfile перед каждой командой; если
      # именованный volume с node_modules устарел (например, после добавления зависимости
      # в package.json), pnpm хочет пересоздать node_modules и спрашивает подтверждение —
      # но в контейнере нет TTY, и без CI=true команда падает с
      # ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY вместо того, чтобы просто переустановить.
      CI: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Весь монорепозиторий пробрасывается внутрь — правки в src/ на хосте
      # сразу видны в контейнере (hot-reload через `next dev` внутри).
      - .:/app
      # Именованные volumes поверх node_modules — ЭТО ВАЖНО. Без них
      # bind-mount выше перекрыл бы node_modules, установленные ВНУТРИ
      # образа при сборке, пустой (или чужой, host-специфичной) версией
      # с хоста. Так контейнерные node_modules остаются нетронутыми.
      - frontend_node_modules:/app/apps/frontend/node_modules
      - frontend_root_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
  frontend_root_node_modules:
  postgres_data:
