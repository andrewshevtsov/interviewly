#
# Сервис backend сам применяет миграции и сиды при каждом старте контейнера:
# prisma generate && prisma migrate deploy && prisma db seed.

services:
  postgres:
    # Alpine-образ меньше полного образа и достаточен для локальной разработки.
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      # Слева порт Mac, справа стандартный порт PostgreSQL в контейнере.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Именованный volume сохраняет таблицы между перезапусками контейнера.
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interviewly-network
    healthcheck:
      # Контейнер считается готовым только после ответа выбранной базы.
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewly} -d ${POSTGRES_DB:-interviewly}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - interviewly-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: отложенные задания (напоминание за 2 часа до встречи) переживают перезапуск Redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - interviewly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Ловушка для писем: принимает SMTP и показывает письма в браузере
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - interviewly-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Серверные компоненты Next.js ходят к backend внутри Docker-сети, а не через localhost
      BACKEND_INTERNAL_URL: http://backend:4000
    ports:
      - 3000:3000
    networks:
      - interviewly-network
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

  collaboration:
    build:
      context: .
      dockerfile: apps/collaboration/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-interviewly}:${POSTGRES_PASSWORD:-interviewly}@postgres:5432/${POSTGRES_DB:-interviewly}?schema=public
    ports:
      - "${COLLABORATION_PORT:-1234}:1234"
    depends_on:
      - backend
    networks:
      - interviewly-network
    volumes:
      - .:/app
      - collaboration_node_modules:/app/node_modules

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: ./.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-interviewly}:${POSTGRES_PASSWORD:-interviewly}@postgres:5432/${POSTGRES_DB:-interviewly}?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    ports:
      - 4000:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - interviewly-network
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

  piston:
    # Piston публикует API только на loopback хоста; контейнеры используют внутреннюю сеть.
    image: ghcr.io/engineer-man/piston
    # Официальный образ собран для amd64; на ARM Docker Desktop использует эмуляцию.
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston_data:/piston
    environment:
      # Пользовательский код не должен иметь сетевого доступа.
      PISTON_DISABLE_NETWORKING: "true"
      # Небольшой сервер обрабатывает только один тяжёлый запуск одновременно.
      PISTON_MAX_CONCURRENT_JOBS: "1"
      PISTON_RUN_TIMEOUT: "3000"
      PISTON_RUN_CPU_TIME: "3000"
      PISTON_RUN_MEMORY_LIMIT: "134217728"
      PISTON_OUTPUT_MAX_SIZE: "65536"
      PISTON_MAX_FILE_SIZE: "100000"
      PISTON_MAX_PROCESS_COUNT: "32"
    networks:
      - interviewly-network
    healthcheck:
      # В образе старый Node без fetch, поэтому проверка использует встроенный http-модуль.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  piston-init:
    # Одноразово устанавливает недостающие runtime после готовности API Piston.
    image: curlimages/curl:8.10.1
    restart: "no"
    environment:
      PISTON_URL: http://piston:2000
    depends_on:
      piston:
        condition: service_healthy
    volumes:
      - ./infra/piston/install-runtimes.sh:/scripts/install-runtimes.sh:ro
    entrypoint: ["/bin/sh", "/scripts/install-runtimes.sh"]
    networks:
      - interviewly-network

  coderunner:
    # Отдельный HTTP-сервис: проверяет участника через backend и только затем вызывает Piston.
    build:
      context: .
      dockerfile: apps/coderunner/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3003
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Имена сервисов Compose работают как DNS-имена внутри interviewly-network.
      BACKEND_INTERNAL_URL: http://backend:4000
      PISTON_URL: http://piston:2000
    ports:
      - "${CODERUNNER_PORT:-3003}:3003"
    depends_on:
      # Запуск разрешён только после готовности всех runtime Piston.
      backend:
        condition: service_started
      piston-init:
        condition: service_completed_successfully
    networks:
      - interviewly-network
    volumes:
      # Dev-режим видит изменения исходников, а Linux-зависимости остаются внутри volume.
      - .:/app
      - coderunner_node_modules:/app/node_modules

networks:
  interviewly-network:
    driver: bridge
volumes:
  redis_data:
  frontend_node_modules:
  backend_node_modules:
  collaboration_node_modules:
  # Не смешиваем Linux node_modules разных сервисов и node_modules хоста.
  coderunner_node_modules:
  postgres_data:
  piston_data:
