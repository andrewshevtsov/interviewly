name: Deploy

# Прод выкатывается только по тегу релиза (vX.Y.Z). Откат: Run workflow с нужным тегом.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза для выкладки, например v0.2.0
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REF: ${{ inputs.tag || github.ref_name }}

jobs:
  provision:
    runs-on: ubuntu-latest
    # Подтверждение перед выкладкой включается в Settings → Environments → production → Required reviewers
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.REF }}
      - name: Install tools and sync the repository
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST || 'interviewly.top' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GIT_REF: ${{ env.REF }}
        run: bash infra/deploy/ssh.sh

  frontend-image:
    needs: provision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.REF }}
      - id: image
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/interviewly-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://interviewly.top/api' }}
            NEXT_PUBLIC_COLLABORATION_URL=${{ vars.NEXT_PUBLIC_COLLABORATION_URL || 'wss://collaboration.interviewly.top' }}
            NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          tags: ${{ steps.image.outputs.name }}:${{ env.REF }}
      - name: Load image on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST || 'interviewly.top' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ env.REF }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPO: ${{ github.repository }}
          GIT_REF: ${{ env.REF }}
          SERVICE: frontend
        run: bash infra/deploy/ssh.sh

  backend-image:
    needs: provision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.REF }}
      - id: image
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/interviewly-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ env.REF }}
      - name: Load image on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST || 'interviewly.top' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ env.REF }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPO: ${{ github.repository }}
          GIT_REF: ${{ env.REF }}
          SERVICE: backend
        run: bash infra/deploy/ssh.sh
