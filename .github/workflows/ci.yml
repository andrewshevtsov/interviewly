name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      collaboration: ${{ steps.filter.outputs.collaboration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          frontend=false
          backend=false
          collaboration=false
          while IFS= read -r file; do
            case "$file" in
              apps/frontend/*) frontend=true ;;
              apps/backend/*) backend=true ;;
              apps/collaboration/*) collaboration=true ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc) frontend=true; backend=true; collaboration=true ;;
              patches/*) frontend=true; backend=true; collaboration=true ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "collaboration=$collaboration" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/frontend run typecheck
      - run: pnpm --filter @app/frontend exec eslint . --ext .ts,.tsx,.js,.jsx

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @app/backend exec prisma generate
        env:
          DATABASE_URL: postgresql://interviewly:interviewly@127.0.0.1:5432/interviewly?schema=public
      - run: pnpm --filter @app/backend run typecheck
      - run: pnpm --filter @app/backend exec eslint "{src,apps,libs,test}/**/*.ts"

  collaboration:
    needs: changes
    if: needs.changes.outputs.collaboration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/collaboration run typecheck
