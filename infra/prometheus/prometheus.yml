# Prometheus тянет метрики по внутренней Docker-сети; наружу порты exporters не публикуются.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:9100"]

  - job_name: livekit
    static_configs:
      - targets: ["livekit:6789"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
