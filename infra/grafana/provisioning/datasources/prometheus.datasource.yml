apiVersion: 1

# Пересоздаём источник: он уже мог быть создан без фиксированного uid (дашборды ссылаются на него)
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
