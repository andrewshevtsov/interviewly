apiVersion: 1

# Пользователь только для чтения (роль создаёт миграция, пароль - infra/postgres/grafana-reader.sh).
# Значения подставляются из переменных окружения контейнера grafana.
datasources:
  - name: Postgres
    type: grafana-postgresql-datasource
    uid: postgres
    access: proxy
    url: postgres:5432
    user: grafana_reader
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
